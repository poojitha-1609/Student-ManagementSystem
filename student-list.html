<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack - Student List</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="dashboard.html" class="brand">
            <span class="brand-icon">E</span>

            <div>
                <strong>EduTrack</strong>
                <small>Student Portal</small>
            </div>
        </a>

        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="student.html">Add Student</a>
            <a href="student-list.html" class="active">Student List</a>
            <button type="button" onclick="logout()" class="nav-logout">
                Logout
            </button>
        </nav>

    </header>


    <main class="container">

        <div class="page-title">

            <div>
                <p class="eyebrow">STUDENT DIRECTORY</p>
                <h1>Student List</h1>
                <p>Search and manage registered students.</p>
            </div>

            <a href="student.html" class="btn primary">
                + Add Student
            </a>

        </div>


        <section class="card">

            <div class="list-toolbar">

                <div>
                    <h2>All Students</h2>
                    <p id="studentCount">0 students</p>
                </div>

                <div class="search-box">
                    🔍
                    <input
                        type="text"
                        id="searchStudent"
                        placeholder="Search by name..."
                    >
                </div>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Gender</th>
                            <th>DOB</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody"></tbody>

                </table>

            </div>


            <div id="emptyMessage" class="empty-state">
                No students found.
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
